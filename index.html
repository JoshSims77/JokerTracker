<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Balatro Joker Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Balatro Joker Tracker</h1>

<div class="upload-container">
    <input type="file" id="jkrUpload" accept=".jkr">

    <label for="jkrUpload" class="upload-button">
        Upload profile.jkr
    </label>

    <div class="upload-hint">
        File is found at
        <span class="path">
            C:\Users\%USERNAME%\AppData\Roaming\Balatro\1
        </span>
        on Windows
    </div>
</div>

<div style="margin-bottom:10px;">
    <button id="selectAll">Select All</button>
    <button id="deselectAll">Deselect All</button>
    <button id="undoLast" disabled>Undo</button>

</div>
   <div class="controls">
    <input type="text" id="search" placeholder="Search Joker..." />
    <span id="completion">Total Completion: 0 / 150 (0%)</span>
</div>

    <table id="jokerTable">
        <thead>
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Effect</th>
                <th>Cost</th>
                <th>Rarity</th>
                <th>Type</th>
                <th>Act</th>
                <th>Gold Stake</th>
            </tr>
        </thead>
        <tbody>
            <!-- Rows populated by JS -->
        </tbody>
    </table>

    <input type="file" id="jkrUpload" accept=".jkr">
    <label for="jkrUpload"><strong>Upload Balatro profile data (profile.jkr)</strong></label>
</div> -->

<footer class="app-footer">
    <span>Want to contribute to this project?</span>
    <a href="https://github.com/JoshSims77/JokerTracker" target="_blank" rel="noopener noreferrer">
        GitHub
    </a>
</footer>


 <script src="https://unpkg.com/fflate@latest/umd/index.js"></script>
<script src="jkr.js"></script>
<script src="jokerfilter.js"></script>
<script src="app.js"></script>

</body>
</html>
